# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - insurance-advisor

on:
  push:
    branches:
      - deploy_webapp
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://artidockers.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_b498e3d4f72f4b4e8606c9a9eee6b9ed }}
        password: ${{ secrets.AzureAppService_ContainerPassword_9ca1bdb2b81d40e7931217b3b8b340d1 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: artidockers.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b498e3d4f72f4b4e8606c9a9eee6b9ed }}/insurance-advisor:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'insurance-advisor'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_a84d9a2d216e48b8a72c69ddaad5e198 }}
        images: 'artidockers.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_b498e3d4f72f4b4e8606c9a9eee6b9ed }}/insurance-advisor:${{ github.sha }}'